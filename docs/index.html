<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polytech Bot Info</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: var(--tg-theme-text-color, #000);
            background: var(--tg-theme-bg-color, #fff);
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .header {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--tg-theme-text-color, #000);
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 10px;
            background: var(--tg-theme-bg-color, #fff);
            border-radius: 8px;
        }
        .label {
            font-weight: 500;
            color: var(--tg-theme-hint-color, #999);
        }
        .value {
            color: var(--tg-theme-text-color, #000);
        }
        #themeInfo {
            margin-top: 20px;
            font-size: 0.9em;
            color: var(--tg-theme-hint-color, #999);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Информация</div>
        
        <div class="card">
            <div class="info-row">
                <span class="label">Telegram ID:</span>
                <span class="value" id="tgId">-</span>
            </div>
            <div class="info-row">
                <span class="label">Имя:</span>
                <span class="value" id="name">-</span>
            </div>
            <div class="info-row">
                <span class="label">Группа:</span>
                <span class="value" id="group">-</span>
            </div>
        </div>

        <div class="card">
            <div class="info-row">
                <span class="label">Тема Telegram:</span>
                <span class="value" id="colorScheme">-</span>
            </div>
        </div>

        <div id="themeInfo"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Получаем базовую информацию из Telegram WebApp
        document.getElementById('tgId').textContent = tg.initDataUnsafe.user.id || 'Не доступно';
        document.getElementById('name').textContent = tg.initDataUnsafe.user.first_name || 'Не доступно';
        document.getElementById('colorScheme').textContent = tg.colorScheme;

        // Отображаем информацию о цветовой схеме
        let themeInfo = document.getElementById('themeInfo');
        themeInfo.innerHTML = `
            Цветовая схема: ${tg.colorScheme}<br>
            Основной цвет: ${tg.themeParams.bg_color}<br>
            Цвет текста: ${tg.themeParams.text_color}
        `;

        // Запрос к API бота для получения информации о группе
        // Здесь нужно будет добавить реальный API endpoint
        // fetch('YOUR_API_ENDPOINT')
        //     .then(response => response.json())
        //     .then(data => {
        //         document.getElementById('group').textContent = data.group;
        //     })
        //     .catch(error => {
        //         console.error('Error:', error);
        //         document.getElementById('group').textContent = 'Ошибка загрузки';
        //     });
    </script>
</body>
</html>
