<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polytech Puffins Stats</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: var(--tg-theme-text-color, #000);
            background: var(--tg-theme-bg-color, #fff);
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .header {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--tg-theme-text-color, #000);
            text-align: center;
        }
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
        .today-status {
            text-align: center;
            font-size: 1.2em;
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            background: var(--tg-theme-bg-color, #fff);
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            text-align: center;
        }
        .stat-item {
            background: var(--tg-theme-bg-color, #fff);
            padding: 10px;
            border-radius: 8px;
            flex: 1;
            margin: 0 5px;
        }
        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--tg-theme-text-color, #000);
        }
        .stat-label {
            font-size: 0.9em;
            color: var(--tg-theme-hint-color, #999);
        }
        .error-message {
            color: #F44336;
            text-align: center;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            background: rgba(244, 67, 54, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Статистика пышек 🍩</div>
        
        <div class="card">
            <div class="today-status" id="todayStatus">
                Загрузка статуса...
            </div>
        </div>

        <div class="card">
            <div class="chart-container">
                <canvas id="puffinsChart"></canvas>
            </div>
        </div>

        <div class="card">
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalDays">-</div>
                    <div class="stat-label">Дней</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="puffinsDays">-</div>
                    <div class="stat-label">Дней с пышками</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="percentage">-</div>
                    <div class="stat-label">% наличия</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let chart = null;

        // API endpoints - используем относительные пути
        const API_BASE_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:8000/api'
            : '/api';  // Будет использовать тот же домен, где хостится сайт
        const HISTORY_ENDPOINT = `${API_BASE_URL}/puffins/history`;
        const TODAY_ENDPOINT = `${API_BASE_URL}/puffins/today`;

        // Функция для форматирования даты
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
        }

        // Функция для обновления графика
        function updateChart(data) {
            const ctx = document.getElementById('puffinsChart').getContext('2d');
            
            if (chart) {
                chart.destroy();
            }

            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(item => formatDate(item.date)),
                    datasets: [{
                        label: 'Наличие пышек',
                        data: data.map(item => item.is_puffins === null ? 0 : item.is_puffins ? 1 : -1),
                        backgroundColor: data.map(item => 
                            item.is_puffins === null ? '#999999' : 
                            item.is_puffins ? '#4CAF50' : '#F44336'
                        ),
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    if (value === 1) return 'Есть';
                                    if (value === 0) return 'Нет данных';
                                    if (value === -1) return 'Нет';
                                    return '';
                                }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        // Функция для обновления статистики
        function updateStats(data) {
            const totalDays = data.length;
            const puffinsDays = data.filter(item => item.is_puffins === true).length;
            const percentage = Math.round((puffinsDays / totalDays) * 100);

            document.getElementById('totalDays').textContent = totalDays;
            document.getElementById('puffinsDays').textContent = puffinsDays;
            document.getElementById('percentage').textContent = percentage + '%';
        }

        // Функция для обновления статуса на сегодня
        function updateTodayStatus(todayData) {
            const todayStatus = document.getElementById('todayStatus');
            
            if (todayData.is_puffins === null) {
                todayStatus.textContent = 'Сегодня: нет информации о пышках';
                todayStatus.style.backgroundColor = '#E0E0E0';
            } else if (todayData.is_puffins) {
                todayStatus.textContent = 'Сегодня: пышки есть! 🎉';
                todayStatus.style.backgroundColor = '#A5D6A7';
            } else {
                todayStatus.textContent = 'Сегодня: пышек нет 😢';
                todayStatus.style.backgroundColor = '#EF9A9A';
            }
            
            if (todayData.message) {
                todayStatus.title = todayData.message;
            }
        }

        // Функция для обработки ошибок
        function handleError(error) {
            console.error('Error:', error);
            const container = document.querySelector('.container');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = 'Произошла ошибка при загрузке данных. Пожалуйста, попробуйте позже.';
            container.insertBefore(errorDiv, container.firstChild);
        }

        // Загрузка данных
        async function loadData() {
            try {
                const [historyResponse, todayResponse] = await Promise.all([
                    fetch(HISTORY_ENDPOINT),
                    fetch(TODAY_ENDPOINT)
                ]);

                if (!historyResponse.ok || !todayResponse.ok) {
                    throw new Error('Network response was not ok');
                }

                const historyData = await historyResponse.json();
                const todayData = await todayResponse.json();

                updateChart(historyData);
                updateStats(historyData);
                updateTodayStatus(todayData);

                // Обновляем данные каждые 5 минут
                setTimeout(loadData, 5 * 60 * 1000);
            } catch (error) {
                handleError(error);
            }
        }

        // Запускаем загрузку данных
        loadData();
    </script>
</body>
</html>
